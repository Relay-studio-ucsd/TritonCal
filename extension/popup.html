<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TritonCal</title>
  <style>
    * { box-sizing: border-box; }
    body { width: 390px; max-height: 580px; overflow-y: auto; margin: 0; background: #f5f7fb; color: #1c293b; font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    header { background: #fff; padding: 18px 20px 14px; border-bottom: 1px solid #dfe5ee; }
    h1 { margin: 0 0 3px; font-size: 22px; }
    .subtitle, .status { color: #5d6b7d; }
    .subtitle { margin: 0; font-size: 12px; }
    .status { margin: 14px 20px; font-size: 12px; }
    .week { display: flex; align-items: center; justify-content: space-between; padding: 12px 20px 0; gap: 6px; }
    .week strong { font-size: 14px; text-align: center; }
    button { border: 1px solid #cdd8e6; border-radius: 8px; background: #fff; padding: 6px 9px; cursor: pointer; color: #244b73; font: inherit; }
    button:hover { background: #ebf3fa; }
    #days { padding: 5px 14px 18px; }
    section { margin: 12px 0; }
    h2 { color: #526176; font-size: 12px; font-weight: 700; margin: 0 6px 7px; }
    .event { border: 1px solid #e0e6ef; border-left: 4px solid #2773a7; background: #fff; border-radius: 9px; margin: 6px 0; padding: 9px 11px; }
    .event.exam { border-left-color: #c47728; }
    .name { font-weight: 700; }
    .detail { color: #4f5f72; font-size: 12px; margin-top: 4px; }
    .empty { color: #657286; text-align: center; padding: 24px 8px; }
  </style>
</head>
<body>
  <header>
    <h1>TritonCal</h1>
    <p class="subtitle">TSS 已加载课程 · 本周课表实验版</p>
  </header>
  <div class="week">
    <button id="previous" aria-label="上一周">‹</button>
    <button id="today">本周</button>
    <strong id="range"></strong>
    <button id="next" aria-label="下一周">›</button>
  </div>
  <p class="status" id="status">正在读取当前标签页…</p>
  <main id="days"></main>
  <script src="parser.js"></script>
  <script src="popup.js"></script>
</body>
</html>
